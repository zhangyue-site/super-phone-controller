dependencies:
  # 1.6.x declares the split esp_driver_* requirements that ESP-IDF 6.0 needs.
  espressif/esp_codec_dev: "^1.6.2"
  espressif/esp_tinyusb: "^2.0.0"
  # ESP-IDF 6.0 moved the USB host layer out of the core tree; on older
  # snapshots this resolves to the in-tree component and is harmless.
  espressif/usb: "^1.0.0"
  idf: ">=5.5"
