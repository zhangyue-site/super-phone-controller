name: Scoped frame guard regression
on:
  push:
    branches: [fix/scoped-frame-guard-contract-20261124]
    paths:
      - display_service/agent_runtime.py
      - tests/test_scoped_frame_contract.py
      - .github/workflows/scoped-frame-guard.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
      PUBLIC_BASE: 0110c415cd28faeec2414aa8cba2701604a553dd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Prepare isolated runtime state and fetch the fixed public baseline
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/scoped-frame.XXXXXXXX")"
          {
            echo "EPAPER_STATE=$state"
            echo "EPAPER_PAIRING_STATE=$state/pairings.sqlite3"
            echo "EPAPER_REMOTE_STATE=$state/remote.json"
            echo "EPAPER_FIRMWARE=$state/firmware"
            echo "EPAPER_NAV_EVIDENCE_DIR=$state/navigation"
            echo "EPAPER_SKILLS=$state/skills"
            echo "EPAPER_QUOTAS=$state/quotas"
            echo "EPAPER_CONFIG=$state/devices.json"
            echo "EPAPER_OPENCLAW_CONFIG=$state/bridge.json"
          } >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin "$PUBLIC_BASE"
      - name: Compare baseline and candidate method identities
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import textwrap

          path = "display_service/agent_runtime.py"
          baseline = subprocess.check_output(["git", "show", os.environ["PUBLIC_BASE"] + ":" + path], text=True)
          candidate = Path(path).read_text()
          for name, source, expected in (
              ("baseline", baseline, "48424b0ac6944f00a4a98f3895fa3780d59af191d4dc9a80d49cc0efe49aefd0"),
              ("candidate", candidate, "a4c72b689fb897ecb0d04af28662df09a5951ba9d03589cf43d43863c9d47ba9"),
          ):
              classes = [n for n in ast.walk(ast.parse(source))
                         if isinstance(n, ast.ClassDef) and n.name == "ScopedFrameGuard"]
              assert len(classes) == 1
              methods = [n for n in classes[0].body if isinstance(n, ast.FunctionDef)
                         and n.name == "_matches_action_frame"]
              assert len(methods) == 1
              method = methods[0]
              lines = source.splitlines(keepends=True)[method.lineno - 1:method.end_lineno]
              actual = hashlib.sha256(textwrap.dedent("".join(lines)).encode()).hexdigest()
              assert actual == expected, name + " mismatch"
              print(name, actual)
          PY
      - name: Reproduce the previous incompatible fourth positional argument
        run: |
          git show "$PUBLIC_BASE:display_service/agent_runtime.py" > "$RUNNER_TEMP/baseline_runtime.py"
          log="$RUNNER_TEMP/baseline-result.txt"
          if SCOPED_FRAME_RUNTIME="$RUNNER_TEMP/baseline_runtime.py" python tests/test_scoped_frame_contract.py FrameCallProtocol.test_current_call_passes_same_job_positional_or_keyword > "$log" 2>&1; then
            echo "The baseline unexpectedly accepted the fourth positional argument."
            exit 1
          fi
          grep -F 'takes 4 positional arguments but 5 were given' "$log"
      - name: Test both calling conventions and rejection conditions
        run: python tests/test_scoped_frame_contract.py -v
      - name: Install synthetic image and keyboard dependencies
        run: python -m pip install --disable-pip-version-check Pillow==12.1.1 -r requirements-keyboard.txt
      - name: Run existing offline agent tests
        run: python tools/run_agent_offline_tests.py
      - name: Run the simulated end-to-end navigation chain
        run: python -m unittest discover -s tests -p test_agent_public_chain.py -v
