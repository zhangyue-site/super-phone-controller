name: Build Flutter app
run-name: ${{ inputs.release_id || 'Manual app build' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建目标'
        required: true
        default: android
        type: choice
        options: [android, ios, both]

      build_name:
        description: 'Optional marketing version'
        type: string
        default: ''
      build_number:
        description: 'Optional build number'
        type: string
        default: ''
      release_id:
        description: 'Private coordinator correlation ID (no secrets)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: spc-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Android 在 ubuntu 上构建，公开仓库免费，私有仓库按实际分钟计费。
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Public source privacy check
        run: |
          python3 ../tools/check_public_source.py
          python3 -m unittest discover -s ../tools -p test_prepare_app_config.py
          python3 -m unittest discover -s ../tools -p test_capture_lifecycle_contract.py

      - name: Restore pinned bundled model
        run: |
          set -euo pipefail
          apk=$(mktemp "$RUNNER_TEMP/model-source.XXXXXX")
          model=$(mktemp "$RUNNER_TEMP/bundled-model.XXXXXX")
          trap 'rm -f "$apk" "$model"' EXIT
          curl --fail --silent --show-error --proto '=https' --max-time 180 \
            https://cdn.zhangyue.site/apps/phone-controller-flash/releases/1.3.17/phone-controller-flash-1.3.17-vc60.apk -o "$apk"
          echo "263c8120640db90889073a23cfd3e77dd64f5ca068ac23eea27185f5eaa4be13  $apk" | sha256sum -c -
          unzip -p "$apk" assets/flutter_assets/assets/bt_v10_int8.onnx > "$model"
          echo "45484096aa3e90b0d3e6b4caf3d94311505d1193972c028675149129d757dbe2  $model" | sha256sum -c -
          install -m 0644 "$model" assets/bt_v10_int8.onnx

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Regression tests
        id: android_regressions
        continue-on-error: true
        run: flutter test --dart-define=CONTROLLER_BASE_URL=https://controller.test

      - name: Native capture and USB session regressions
        run: |
          mkdir -p "$RUNNER_TEMP/capture-jvm"
          javac -d "$RUNNER_TEMP/capture-jvm" android/app/src/main/java/org/example/phonecontroller/{CaptureRecoveryGuard,UsbSessionLease,UsbModeWindow,DiagnosticSchema,UsbInterfaceClaim,UsbControllerProfile}.java android/app/src/test/java/org/example/phonecontroller/{CaptureRecoveryGuardTest,UsbModeWindowTest,DiagnosticSchemaTest,UsbInterfaceClaimTest,UsbControllerProfileTest}.java
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.CaptureRecoveryGuardTest
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.UsbModeWindowTest
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.DiagnosticSchemaTest
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.UsbInterfaceClaimTest
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.UsbControllerProfileTest

      - name: Build signed APK
        env:
          CONTROLLER_BASE_URL: ${{ secrets.CONTROLLER_BASE_URL }}
          CONTROLLER_DOWNLOAD_URL: ${{ secrets.CONTROLLER_DOWNLOAD_URL }}
          CONTROLLER_APPLICATION_ID: ${{ secrets.CONTROLLER_APPLICATION_ID }}
          PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.PRIVATE_ARTIFACT_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PCFLASH_REMOTE_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          test -n "$PRIVATE_ARTIFACT_PASSWORD" || { echo "Private artifact encryption is required"; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/controller-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          export CONTROLLER_RUNTIME_CONFIG="$RUNNER_TEMP/controller-runtime.json"
          python3 ../tools/prepare_app_config.py --output "$CONTROLLER_RUNTIME_CONFIG"
          chmod 600 "$CONTROLLER_RUNTIME_CONFIG"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH" "$CONTROLLER_RUNTIME_CONFIG"' EXIT
          args=(--release --dart-define-from-file="$CONTROLLER_RUNTIME_CONFIG")
          if [[ -n "$BUILD_NAME" ]]; then
            [[ "$BUILD_NAME" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
            args+=(--build-name="$BUILD_NAME")
          fi
          if [[ -n "$BUILD_NUMBER" ]]; then
            [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
            args+=(--build-number="$BUILD_NUMBER")
          fi
          flutter build apk "${args[@]}"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          command -v 7z >/dev/null || sudo apt-get install -y p7zip-full
          7z a -t7z -mhe=on -p"$PRIVATE_ARTIFACT_PASSWORD" "$RUNNER_TEMP/controller-private-build.7z" build/app/outputs/flutter-apk/app-release.apk >/dev/null


      - uses: actions/upload-artifact@v4
        with:
          name: controller-private-build
          retention-days: 7
          path: ${{ runner.temp }}/controller-private-build.7z
          if-no-files-found: error

      - name: Require regressions to pass before release
        if: ${{ steps.android_regressions.outcome == 'failure' }}
        run: |
          echo 'The encrypted APK is available for diagnosis. This run is not release eligible.'
          exit 1

  ios:
    # Public repository + standard GitHub macOS runner: free build minutes.
    # Dispatch remains explicit to avoid unnecessary builds.
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve iOS dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Validate source and app
        run: |
          python3 ../tools/check_public_source.py
          python3 -m unittest discover -s ../tools -p test_ios_capture_contract.py
          flutter analyze
          flutter test --dart-define=CONTROLLER_BASE_URL=https://controller.test
      - name: Verify iOS 27 cold launch and native bridges
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          SIMULATOR_ID=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/ios-simulators.json")); candidates=[x for runtime,items in d["devices"].items() if "iOS-27" in runtime for x in items if x.get("isAvailable") and "iPhone" in x["name"]]; assert candidates,"iOS27 simulator required"; print(candidates[0]["udid"])')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          flutter test integration_test/startup_test.dart -d "$SIMULATOR_ID" --no-pub --dart-define=CONTROLLER_BASE_URL=https://controller.test
          xcrun simctl terminate "$SIMULATOR_ID" org.example.phonecontroller || true
          xcrun simctl shutdown "$SIMULATOR_ID"
      - name: Build unsigned device app
        env:
          CONTROLLER_BASE_URL: ${{ secrets.CONTROLLER_BASE_URL }}
          PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.PRIVATE_ARTIFACT_PASSWORD }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_ARTIFACT_PASSWORD"
          export CONTROLLER_APPLICATION_ID=org.example.phonecontroller
          export CONTROLLER_RUNTIME_CONFIG="$RUNNER_TEMP/controller-ios-runtime.json"
          trap 'rm -f "$CONTROLLER_RUNTIME_CONFIG"' EXIT
          python3 ../tools/prepare_app_config.py --output "$CONTROLLER_RUNTIME_CONFIG"
          args=(--release --no-codesign --dart-define-from-file="$CONTROLLER_RUNTIME_CONFIG")
          if [[ -n "$BUILD_NAME" ]]; then
            [[ "$BUILD_NAME" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
            args+=(--build-name="$BUILD_NAME")
          fi
          if [[ -n "$BUILD_NUMBER" ]]; then
            [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
            args+=(--build-number="$BUILD_NUMBER")
          fi
          flutter build ios "${args[@]}"
          if grep -q 'DKImagePickerController' ios/Podfile.lock; then
            echo 'Unexpected photo-library dependency in firmware document picker' >&2
            exit 1
          fi
          test -d build/ios/iphoneos/Runner.app/PlugIns/ScreenBroadcast.appex
          xcrun nm -gjU build/ios/iphoneos/Runner.app/Runner | grep -Fx _OrtGetApiBase
      - name: Package private unsigned IPA
        env:
          PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.PRIVATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          command -v 7zz >/dev/null || brew install sevenzip
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$RUNNER_TEMP/controller-unsigned.ipa" Payload
          7zz a -t7z -mhe=on -p"$PRIVATE_ARTIFACT_PASSWORD" "$RUNNER_TEMP/controller-ios-private-build.7z" "$RUNNER_TEMP/controller-unsigned.ipa" >/dev/null
          rm -f "$RUNNER_TEMP/controller-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: controller-ios-private-build
          path: ${{ runner.temp }}/controller-ios-private-build.7z
          if-no-files-found: error
          retention-days: 7
