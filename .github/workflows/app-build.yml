name: Build Flutter app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建目标'
        required: true
        default: android
        type: choice
        options: [android, ios, both]

permissions:
  contents: read

concurrency:
  group: spc-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Android 在 ubuntu 上构建，公开仓库免费，私有仓库按实际分钟计费。
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Public source privacy check
        run: |
          python3 ../tools/check_public_source.py
          python3 -m unittest discover -s ../tools -p test_prepare_app_config.py

      - name: Analyze
        run: flutter analyze

      - name: Regression tests
        run: flutter test --dart-define=CONTROLLER_BASE_URL=https://controller.test

      - name: Native capture and USB session regressions
        run: |
          mkdir -p "$RUNNER_TEMP/capture-jvm"
          javac -d "$RUNNER_TEMP/capture-jvm" android/app/src/main/java/org/example/phonecontroller/{CaptureRecoveryGuard,UsbSessionLease,UsbModeWindow,DiagnosticSchema}.java android/app/src/test/java/org/example/phonecontroller/{CaptureRecoveryGuardTest,UsbModeWindowTest,DiagnosticSchemaTest}.java
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.CaptureRecoveryGuardTest
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.UsbModeWindowTest
          java -ea -cp "$RUNNER_TEMP/capture-jvm" org.example.phonecontroller.DiagnosticSchemaTest

      - name: Build signed APK
        env:
          CONTROLLER_BASE_URL: ${{ secrets.CONTROLLER_BASE_URL }}
          CONTROLLER_DOWNLOAD_URL: ${{ secrets.CONTROLLER_DOWNLOAD_URL }}
          CONTROLLER_APPLICATION_ID: ${{ secrets.CONTROLLER_APPLICATION_ID }}
          PRIVATE_ARTIFACT_PASSWORD: ${{ secrets.PRIVATE_ARTIFACT_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_ARTIFACT_PASSWORD" || { echo "Private artifact encryption is required"; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/controller-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          export CONTROLLER_RUNTIME_CONFIG="$RUNNER_TEMP/controller-runtime.json"
          python3 ../tools/prepare_app_config.py --output "$CONTROLLER_RUNTIME_CONFIG"
          chmod 600 "$CONTROLLER_RUNTIME_CONFIG"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH" "$CONTROLLER_RUNTIME_CONFIG"' EXIT
          flutter build apk --release --dart-define-from-file="$CONTROLLER_RUNTIME_CONFIG"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          command -v 7z >/dev/null || sudo apt-get install -y p7zip-full
          7z a -t7z -mhe=on -p"$PRIVATE_ARTIFACT_PASSWORD" "$RUNNER_TEMP/controller-private-build.7z" build/app/outputs/flutter-apk/app-release.apk >/dev/null


      - uses: actions/upload-artifact@v4
        with:
          name: controller-private-build
          path: ${{ runner.temp }}/controller-private-build.7z
          if-no-files-found: error

  ios:
    # macOS runner 按 10 倍计费：跑 1 分钟扣 10 分钟额度。
    # 因此只在显式选择 ios 时构建，绝不挂在 push 上。
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          # 不签名只出 .app，用于验证真机可编译。要装到手机需在本地
          # 用开发者证书重签，或配好 provisioning profile 后改 --export-method。
          flutter build ios --release --no-codesign

      - name: Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/pcflash-ios.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pcflash-ios
          path: pcflash-ios.ipa
          if-no-files-found: error
