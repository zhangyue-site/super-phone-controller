name: Build AMOLED firmware
on:
  workflow_dispatch:
  push:
    branches: ['codex/amoled-plugin-controller']
    paths: ['firmware-amoled/**', '.github/workflows/amoled-firmware.yml', 'tools/test_amoled_registry.py', 'tests/fixtures/amoled-plugin-cases.json']
permissions:
  contents: read
concurrency:
  group: amoled-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: espressif/idf:v5.5.2
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /github/home/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /github/home/.ccache
          key: amoled-idf552-${{ runner.os }}-${{ github.sha }}
          restore-keys: amoled-idf552-${{ runner.os }}-
      - name: Host registry validation with sanitizers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/test_amoled_registry.py --output-dir /tmp/amoled-registry-tests
          python3 tools/test_amoled_control.py
          python3 tools/test_amoled_ota.py
          python3 tools/test_amoled_power.py
          python3 tools/test_amoled_version_policy.py
          python3 tools/test_amoled_interlock.py
          python3 tools/test_amoled_wifi_nvs.py
          python3 tools/test_amoled_wifi_worker.py
          python3 tools/test_amoled_wifi.py
          python3 tools/test_amoled_wifi_transport.py
          python3 tools/test_amoled_wifi_ingress.py
          python3 tools/test_amoled_direct.py
          python3 tools/test_amoled_direct_owner.py
          python3 tools/test_amoled_direct_disconnect.py
          python3 tools/test_amoled_font.py
          python3 tools/test_amoled_audio.py
          python3 tools/test_amoled_audio_owner.py
          python3 tools/test_amoled_audio_recorder.py
          python3 tools/test_amoled_audio_transport.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/check_amoled_audio_syntax.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/test_amoled_plugin.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/test_amoled_plugin_transport.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/check_amoled_plugin_syntax.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/test_amoled_direct_runtime.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/test_amoled_direct_transport.py --cjson-dir /tmp/amoled-registry-tests
          python3 tools/check_amoled_direct_syntax.py --cjson-dir /tmp/amoled-registry-tests
      - name: Build independent AMOLED target
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware-amoled
          idf.py -DIDF_TARGET=esp32s3 reconfigure
          grep -qx CONFIG_ESP_CONSOLE_UART_DEFAULT=y sdkconfig
          grep -qx CONFIG_ESP_CONSOLE_SECONDARY_NONE=y sdkconfig
          if grep -qx CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG_ENABLED=y sdkconfig; then exit 1; fi
          idf.py build
          xtensa-esp32s3-elf-nm -g --defined-only build/phone_controller_amoled.elf > build/linked-symbols.txt
          python3 ../tools/check_amoled_symbols.py build/linked-symbols.txt
          idf.py merge-bin -o phone-controller-amoled-full.bin
      - name: Collect verifiable binaries
        shell: bash
        run: |
          mkdir out
          cp firmware-amoled/build/phone_controller_amoled.bin out/app.bin
          cp firmware-amoled/build/phone-controller-amoled-full.bin out/full.bin
          cp firmware-amoled/build/phone_controller_amoled.elf out/
          cp firmware-amoled/build/phone_controller_amoled.map out/
          cp firmware-amoled/build/linked-symbols.txt out/
          cp firmware-amoled/build/flash_args out/
          cp firmware-amoled/build/flasher_args.json out/
          cp firmware-amoled/build/project_description.json out/
          cp firmware-amoled/dependencies.lock out/
          cp firmware-amoled/sdkconfig out/
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE
          cd out
          sha256sum *.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amoled-firmware-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: error
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /github/home/.ccache
          key: amoled-idf552-${{ runner.os }}-${{ github.sha }}

  build-usb-local:
    name: USB-Local (NCM+ADB) variant + boundary tests
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Install test deps
        run: |
          . "$IDF_PATH/export.sh"
          python3 -m pip install cryptography --quiet
      - name: Architecture boundary test (ADB input-only)
        run: python3 -m unittest discover -s tests -p "test_amoled_adb_boundary.py" -v
      - name: Provision throwaway ADB identity
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/provision_amlite_adb_key.py --ci
      - name: Build usb-local variant
        working-directory: firmware-amoled
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DIDF_TARGET=esp32s3 -D CONTROLLER_USB_LOCAL_VARIANT=1 -B build-usb-local -D SDKCONFIG=sdkconfig.usb-local -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.usb-local.defaults" build
          grep -q "#define CONFIG_TINYUSB_NET_MODE_NCM 1" build-usb-local/config/sdkconfig.h
          grep -q "#define CONFIG_CONTROLLER_USB_LOCAL 1" build-usb-local/config/sdkconfig.h
          nm build-usb-local/*.elf | grep -q controller_usb_net_init
          nm build-usb-local/*.elf | grep -q controller_adb_init
      - name: Regression guard (default build carries no usb-local symbols)
        working-directory: firmware-amoled
        run: |
          . "$IDF_PATH/export.sh"
          rm -rf build-default-regcheck
          idf.py -DIDF_TARGET=esp32s3 -B build-default-regcheck build
          if grep -q "CONFIG_CONTROLLER_USB_LOCAL 1" build-default-regcheck/config/sdkconfig.h; then echo "default sdkconfig polluted by variant"; exit 1; fi
          if nm build-default-regcheck/*.elf | grep -q controller_usb_net_init; then exit 1; fi
          if nm build-default-regcheck/*.elf | grep -q controller_adb_init; then exit 1; fi
      - name: Collect usb-local artifacts
        working-directory: firmware-amoled
        run: |
          mkdir -p out-usb-local
          cp build-usb-local/*.bin out-usb-local/
          sha256sum out-usb-local/*.bin > out-usb-local/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amoled-firmware-usb-local-${{ github.run_number }}
          path: out-usb-local/
          retention-days: 14
          if-no-files-found: error
