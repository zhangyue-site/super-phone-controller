name: Build AMOLED firmware
on:
  workflow_dispatch:
  push:
    branches: ['codex/amoled-plugin-controller']
    paths: ['firmware-amoled/**', '.github/workflows/amoled-firmware.yml', 'tools/test_amoled_registry.py', 'tests/fixtures/amoled-plugin-cases.json']
permissions:
  contents: read
concurrency:
  group: amoled-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: espressif/idf:v5.5.2
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /github/home/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /github/home/.ccache
          key: amoled-idf552-${{ runner.os }}-${{ github.sha }}
          restore-keys: amoled-idf552-${{ runner.os }}-
      - name: Host registry validation with sanitizers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/test_amoled_registry.py --output-dir /tmp/amoled-registry-tests
      - name: Build independent AMOLED target
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware-amoled
          idf.py -DIDF_TARGET=esp32s3 reconfigure
          grep -qx CONFIG_ESP_CONSOLE_UART_DEFAULT=y sdkconfig
          grep -qx CONFIG_ESP_CONSOLE_SECONDARY_NONE=y sdkconfig
          if grep -qx CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG_ENABLED=y sdkconfig; then exit 1; fi
          idf.py build
          idf.py merge-bin -o phone-controller-amoled-full.bin
      - name: Collect verifiable binaries
        shell: bash
        run: |
          mkdir out
          cp firmware-amoled/build/phone_controller_amoled.bin out/app.bin
          cp firmware-amoled/build/phone-controller-amoled-full.bin out/full.bin
          cp firmware-amoled/build/phone_controller_amoled.elf out/
          cp firmware-amoled/build/phone_controller_amoled.map out/
          cp firmware-amoled/build/flash_args out/
          cp firmware-amoled/build/flasher_args.json out/
          cp firmware-amoled/build/project_description.json out/
          cp firmware-amoled/dependencies.lock out/
          cp firmware-amoled/sdkconfig out/
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE
          cd out
          sha256sum *.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amoled-firmware-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: error
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /github/home/.ccache
          key: amoled-idf552-${{ runner.os }}-${{ github.sha }}
