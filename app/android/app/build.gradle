plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseStore = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (releaseBuild && !releaseStore) {
    throw new GradleException("Release signing requires the cloud Android keystore configuration")
}

def configuredBase = (System.getenv("CONTROLLER_BASE_URL") ?: "").trim().replaceAll(/\/+$/, "")
def configuredDownload = System.getenv("CONTROLLER_DOWNLOAD_URL") ?: ""
def configuredApplicationId = System.getenv("CONTROLLER_APPLICATION_ID")
def validServiceUrl = { value ->
    try {
        def uri = new java.net.URI(value)
        return uri.scheme == "https" && uri.host && !uri.userInfo && !uri.rawQuery && !uri.rawFragment
    } catch (Exception ignored) { return false }
}
if (releaseBuild && (!validServiceUrl(configuredBase) || !configuredApplicationId)) {
    throw new GradleException("Release requires CONTROLLER_BASE_URL (HTTPS) and the existing CONTROLLER_APPLICATION_ID")
}
if (configuredDownload && !validServiceUrl(configuredDownload)) {
    throw new GradleException("CONTROLLER_DOWNLOAD_URL must be HTTPS without credentials, query or fragment")
}

android {
    namespace = "org.example.phonecontroller"
    // Flutter 3.44 and current BLE/file-picker plugins require API 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures { buildConfig = true }
    defaultConfig {
        buildConfigField "String", "CONTROLLER_BASE_URL", groovy.json.JsonOutput.toJson(configuredBase)
        buildConfigField "String", "DOWNLOAD_URL", groovy.json.JsonOutput.toJson(configuredDownload)

        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = configuredApplicationId ?: "org.example.phonecontroller"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv("ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseStore) signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
